name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  format:
    name: Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm format:check

  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint

  typecheck:
    name: Typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck

  test:
    name: Test (Node ${{ matrix.node-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 22 is the minimum supported version (package.json engines), 24 is current.
        node-version: [22, 24]
    services:
      mongodb:
        image: mongo:8
        ports:
          - 27017:27017
    env:
      DATABASE_URL: mongodb://localhost:27017/payload-content-cli
      PAYLOAD_SECRET: ci-test-secret
      PAYLOAD_URL: http://localhost:3939
      PAYLOAD_API_KEY: test-api-key-for-development
      # Fail the build if the integration env wiring breaks, instead of
      # letting the remote suites skip silently.
      CI_REQUIRE_INTEGRATION: "1"
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v6
        with:
          node-version: ${{ matrix.node-version }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - name: Smoke test packed artifact
        run: |
          PKG=$(pnpm pack --pack-destination /tmp | tail -1)
          npm install --prefix /tmp/pack-smoke "$PKG"
          /tmp/pack-smoke/node_modules/.bin/payload-content --version
          /tmp/pack-smoke/node_modules/.bin/payload-content skill --output /tmp/pack-smoke/SKILL.md
          test -s /tmp/pack-smoke/SKILL.md
      - name: Start Payload dev server
        run: pnpm example:dev &
      - name: Wait for Payload to be ready
        run: timeout 120 bash -c 'until curl -sf http://localhost:3939/api/access; do sleep 2; done'
      - name: Seed test data
        run: pnpm example:seed
      - run: pnpm test
